[package]
name = "opensearch-developer-workbench"
version = "0.0.1"
description = "OpenSearch Developer Workbench - Query notebook and security role generator"
authors = ["OpenSearch Contributors"]
license = "Apache-2.0"
repository = ""
edition = "2021"

[lib]
name = "opensearch_developer_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-shell = "=2.3.6"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
dirs = "=5.0.1"
regex = "=1.13.1"
reqwest = { version = "=0.12.28", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "=1.53.1", features = ["full"] }
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
base64 = "=0.22.1"
sha2 = "=0.10.9"
bytes = "=1.12.1"
tonic = { version = "=0.12.3", features = ["tls-native-roots"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-updater = "=2.12.0"
tempfile = "=3.27.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
